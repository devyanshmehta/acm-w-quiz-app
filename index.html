<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACM-W AI Nexus Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #0b253a 0%, #030d18 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(10, 25, 47, 0.75);
      border: 1px solid #00f2fe;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
      backdrop-filter: blur(10px);
      padding: 30px;
      text-align: center;
    }

    .header-title {
      font-size: 2rem;
      font-weight: 700;
      color: #4facfe;
      text-shadow: 0 0 12px rgba(79, 172, 254, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header-subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .creator-tag {
      font-size: 0.85rem;
      color: #00f2fe;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 16px;
      padding: 40px 25px;
      margin-top: 25px;
      box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.05);
    }

    .card-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .user-greeting {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .score-number {
      font-size: 3.8rem;
      font-weight: 800;
      color: #38ef7d;
      text-shadow: 0 0 20px rgba(56, 239, 125, 0.4);
      margin-bottom: 10px;
    }

    .accuracy-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 15px;
    }

    .badge-text {
      font-size: 1.2rem;
      color: #ffb703;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .completion-note {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .question-box {
      font-size: 1.2rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .option-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #4facfe;
      color: #fff;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .option-btn:hover:not(:disabled) {
      background: #4facfe;
      color: #000;
      box-shadow: 0 0 12px rgba(79, 172, 254, 0.5);
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-action {
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      color: #ffffff;
      border: none;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 114, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 114, 255, 0.7);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-title">
        <span>🤖</span> ACM-W AI NEXUS PRO
      </div>
      <div class="header-subtitle">AI Knowledge Championship</div>
      <div class="creator-tag">Created by <strong>Devyansh Mehta</strong></div>
    </div>

    <!-- Active Quiz Screen -->
    <div id="quiz-screen" class="card">
      <div id="question-text" class="question-box">Loading question...</div>
      <div id="options-container" class="options-grid"></div>
    </div>

    <!-- Final Results Screen -->
    <div id="results-screen" class="card hidden">
      <h2 class="card-title">Mission Complete</h2>
      <p class="user-greeting">Participant, your AI report is ready.</p>
      
      <div id="score-display" class="score-number">0/15</div>
      <div id="accuracy-display" class="accuracy-text">0% Accuracy</div>
      <div id="badge-display" class="badge-text">🏆 AI Master</div>
      <p class="completion-note">You completed the ACM-W AI Nexus challenge.</p>

      <button id="restart-btn" class="btn-action" onclick="startQuiz()">Restart Mission</button>
    </div>
  </div>

  <script>
    // Master Question Pool
    const rawQuizData = [
      { question: "What does AI stand for?", options: ["Artificial Intelligence", "Automated Integration", "Advanced Interface", "Algorithmic Insight"], answer: 0 },
      { question: "Which test evaluates if a machine exhibits human intelligence?", options: ["Turing Test", "Voight-Kampff Test", "CAPTCHA Test", "Binary Test"], answer: 0 },
      { question: "Which algorithm is commonly used for neural network training?", options: ["Backpropagation", "QuickSort", "Dijkstra's Algorithm", "K-Means"], answer: 0 },
      { question: "What does ACM-W support?", options: ["Women in Computing", "Hardware Manufacturing", "Web Browsers", "Database Management"], answer: 0 },
      { question: "Which field sub-categorizes Machine Learning?", options: ["Artificial Intelligence", "Robotics", "Cybersecurity", "Networking"], answer: 0 },
      { question: "What type of learning uses labelled data?", options: ["Supervised Learning", "Unsupervised Learning", "Reinforcement Learning", "Self Learning"], answer: 0 },
      { question: "Which parameter controls learning speed in ML?", options: ["Learning Rate", "Epoch Rate", "Batch Size", "Momentum"], answer: 0 },
      { question: "What is NLP in Artificial Intelligence?", options: ["Natural Language Processing", "National Logic Protocol", "Neural Link Programming", "Network Layer Protocol"], answer: 0 },
      { question: "Which AI model type generates new text or media?", options: ["Generative AI", "Analytical AI", "Reactive AI", "Deterministic AI"], answer: 0 },
      { question: "What is the main component of a Deep Learning system?", options: ["Artificial Neural Networks", "Decision Trees", "Relational Tables", "State Machines"], answer: 0 },
      { question: "Which algorithm uses reward-based learning?", options: ["Reinforcement Learning", "Supervised Learning", "Unsupervised Learning", "Clustering"], answer: 0 },
      { question: "What is overfitting in Machine Learning?", options: ["Model fits training data too well", "Model is too simple", "Model trains too fast", "Model lacks memory"], answer: 0 },
      { question: "Which python library is widely used for Data Science?", options: ["Pandas", "React", "Django", "Laravel"], answer: 0 },
      { question: "What does LLM stand for?", options: ["Large Language Model", "Linear Logic Machine", "Logical Link Method", "Latent Learning Mode"], answer: 0 },
      { question: "What field combines vision processing with AI?", options: ["Computer Vision", "Graphics Rendering", "Spatial Audio", "Haptics"], answer: 0 }
    ];

    let activeQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswered = false;

    // Helper: Fisher-Yates Array Shuffle
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Start / Reset Quiz Logic
    function startQuiz() {
      score = 0;
      currentQuestionIndex = 0;
      isAnswered = false;

      // Shuffle order of questions for every attempt
      activeQuestions = shuffleArray(rawQuizData);

      document.getElementById('results-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      showQuestion();
    }

    // Display Current Question with Shuffled Options
    function showQuestion() {
      isAnswered = false;
      const q = activeQuestions[currentQuestionIndex];
      document.getElementById('question-text').textContent = `${currentQuestionIndex + 1}. ${q.question}`;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      // Map options to track correctness, then shuffle them
      const mappedOptions = q.options.map((optText, idx) => ({
        text: optText,
        isCorrect: idx === q.answer
      }));
      
      const shuffledOptions = shuffleArray(mappedOptions);

      // Render buttons in randomized order
      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.text;
        btn.onclick = () => selectOption(opt.isCorrect);
        optionsContainer.appendChild(btn);
      });
    }

    // Handle Option Selection
    function selectOption(isCorrect) {
      if (isAnswered) return;
      isAnswered = true;

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);

      if (isCorrect) {
        score++;
      }

      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuestions.length) {
          showQuestion();
        } else {
          showResults();
        }
      }, 350);
    }

    // Render Clean Final Performance Score
    function showResults() {
      const totalQuestions = activeQuestions.length;
      const finalScore = Math.min(score, totalQuestions);
      const accuracy = Math.round((finalScore / totalQuestions) * 100);

      document.getElementById('score-display').textContent = `${finalScore}/${totalQuestions}`;
      document.getElementById('accuracy-display').textContent = `${accuracy}% Accuracy`;

      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('results-screen').classList.remove('hidden');
    }

    // Initialize application
    startQuiz();
  </script>
</body>
</html>
