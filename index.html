<!DOCTYPE html>
<html>
<head>
<title>ACM-W AI Nexus Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(circle at top,#164e63,#020617);
color:white;
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
background-image:
radial-gradient(#22d3ee 1px,transparent 1px);
background-size:35px 35px;
opacity:.15;
}


.container{
width:95%;
max-width:850px;
position:relative;
z-index:2;
text-align:center;
}


.logo{
font-size:45px;
font-weight:900;
color:#22d3ee;
text-shadow:
0 0 20px cyan;
}


.subtitle{
color:#cbd5e1;
margin-bottom:25px;
}


.card{

background:
rgba(15,23,42,.88);

border:1px solid #22d3ee;

border-radius:25px;

padding:35px;

box-shadow:
0 0 40px rgba(34,211,238,.35);

}


input{

width:80%;

padding:15px;

border-radius:25px;

border:none;

outline:none;

font-size:16px;

margin:15px;

}


button{

padding:15px 25px;

margin:10px;

border:none;

border-radius:30px;

cursor:pointer;

font-size:16px;

font-weight:bold;

color:white;

background:
linear-gradient(90deg,#06b6d4,#8b5cf6);

transition:.3s;

}


button:hover{

transform:scale(1.05);

box-shadow:
0 0 25px cyan;

}


.option{

display:block;

width:100%;

text-align:left;

background:#111827;

border:1px solid #334155;

}


.option.correct{

background:#166534;

}


.option.wrong{

background:#991b1b;

}


.top{

display:flex;

justify-content:space-between;

margin-bottom:15px;

font-weight:bold;

}


.timer{

color:#facc15;

font-size:22px;

}


.progress{

height:12px;

background:#1e293b;

border-radius:20px;

overflow:hidden;

}


.progress div{

height:100%;

background:#22d3ee;

}


.score{

font-size:55px;

color:#22d3ee;

font-weight:900;

}


.badge{

font-size:22px;

color:#facc15;

}


.hidden{

display:none;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
🤖 ACM-W AI NEXUS PRO
</div>


<div class="subtitle">
AI Knowledge Championship
</div>


<div class="card" id="app">


<h2>Welcome Explorer</h2>

<p>
Enter your name to start the AI assessment.
</p>


<input id="name" placeholder="Enter your name">


<br>


<button onclick="startQuiz()">
INITIALIZE MISSION
</button>


</div>


</div>
